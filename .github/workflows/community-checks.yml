name: Community checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      # The desktop tests start the real Electron binary (desktop-frame) and a headless Chromium (theme).
      - run: npm --prefix desktop ci
      - name: Headless Chromium for the startup-page test
        shell: bash
        run: npx playwright install --only-shell $([ "$RUNNER_OS" = Linux ] && echo --with-deps) chromium
      - run: npm run build
      - run: npm run web:build
      - run: npm --prefix web test
      - name: Browser recovery and human responses
        run: node --test dist/tests/result-recovery.test.js dist/tests/browser-recovery.test.js dist/tests/human-assist.test.js
      # Linux runners have no display, and Ubuntu's AppArmor blocks Electron's namespace sandbox unless its
      # setuid helper is owned by root.
      - name: Electron display and sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Desktop shell
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop; else npm run test:desktop; fi
      - name: Configuration, auth, provider contracts and compatibility
        run: node --test --test-concurrency=1 dist/tests/config-file.test.js dist/tests/local-auth.test.js dist/tests/docker-host.test.js dist/tests/env-alias.test.js dist/tests/brand-compat.test.js dist/tests/brand-audit.test.js dist/tests/provider-connections.test.js
      - name: Public source hygiene
        run: node scripts/check-public-tree.mjs --all
      - name: Publication guard regression
        run: node --test scripts/check-public-tree.test.mjs
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify the pinned scanner
        shell: bash
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan public history
        run: ./gitleaks git --redact --no-banner --log-opts=--all
